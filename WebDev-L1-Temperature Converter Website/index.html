<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <section class="converter-card">

            <div class="icon">🌡️</div>

            <h1>Temperature Converter</h1>
            <p class="subtitle">
                Convert temperatures quickly and accurately
            </p>

            <form id="temperatureForm">

                <div class="input-group">
                    <label for="temperature">Temperature</label>

                    <input
                        type="number"
                        id="temperature"
                        placeholder="Enter temperature"
                        step="any"
                        autocomplete="off"
                    >
                </div>

                <div class="input-group">
                    <label for="unit">Input Unit</label>

                    <select id="unit">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>

                <button type="submit" id="convertBtn">
                    Convert Temperature
                </button>

            </form>

            <div id="message" class="message"></div>

            <div id="results" class="results">

                <h2>Converted Results</h2>

                <div class="result-grid">

                    <div class="result-box">
                        <span class="result-label">Celsius</span>
                        <strong id="celsiusResult">-- °C</strong>
                    </div>

                    <div class="result-box">
                        <span class="result-label">Fahrenheit</span>
                        <strong id="fahrenheitResult">-- °F</strong>
                    </div>

                    <div class="result-box">
                        <span class="result-label">Kelvin</span>
                        <strong id="kelvinResult">-- K</strong>
                    </div>

                </div>

            </div>

        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
